# dsh-claude-bridge bundle layer: mount the plugin on the host plane of any profile that lists this
# bundle. The event file defaults to ~/.local/state/dsh-events/turns.jsonl; set `config.file` in your
# profile's cordis.patch.yml (id: dsh-claude-bridge) or DSH_TURN_EVENTS_FILE to move it.
- insert:
    - id: dsh-claude-bridge
      name: 'dsh-claude-bridge'
